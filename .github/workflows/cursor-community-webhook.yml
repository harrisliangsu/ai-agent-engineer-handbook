name: Forward community events to Grok Bot

on:
  issues:
    types: [opened, edited, closed, reopened, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  discussion:
    types: [created, edited, answered]
  discussion_comment:
    types: [created]
  watch:
    types: [started]
  fork:

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: POST payload to Cursor automation webhook
        uses: actions/github-script@v7
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_COMMUNITY_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_COMMUNITY_WEBHOOK_KEY }}
        with:
          script: |
            const url = process.env.WEBHOOK_URL;
            const key = process.env.WEBHOOK_KEY;
            if (!url || !key) {
              core.warning('CURSOR_COMMUNITY_WEBHOOK_URL / KEY missing; skip forward');
              return;
            }
            const res = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${key}`,
                'Content-Type': 'application/json',
                'X-GitHub-Event': context.eventName,
                'X-GitHub-Delivery': String(context.runId),
              },
              body: JSON.stringify(context.payload),
            });
            const text = await res.text();
            if (!res.ok) {
              core.setFailed(`webhook HTTP ${res.status}: ${text.slice(0, 500)}`);
              return;
            }
            core.info(`forwarded ok: ${text.slice(0, 200)}`);
